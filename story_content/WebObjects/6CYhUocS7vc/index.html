<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الأنشطة التفاعلية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['arakom', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @font-face {
            font-family: 'arakom';
            src: url('arakom.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'arakom', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Taşmaları önlemek için */
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 w-[1920px] h-[1080px] flex flex-col justify-center items-center overflow-hidden">

    <main class="w-full h-full px-16 py-12 flex flex-col justify-center items-center gap-12">
        
        <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-200/60 text-center max-w-6xl w-full">
            <h1 class="text-6xl font-normal text-gray-900">
                اُنْقُرْ عَلى الصّورَتَيْن.
            </h1>
        </div>

        <div class="grid grid-cols-2 gap-16 max-w-7xl w-full justify-center items-center">

            <a href="c.html" 
               class="activity-card group bg-white rounded-3xl overflow-hidden border border-gray-200 shadow-md hover:shadow-lg transition-all duration-200 flex flex-col w-full hover:-translate-y-2">
                <div class="relative aspect-[16/9] w-full overflow-hidden bg-gray-50 border-b border-gray-100">
                    <img src="e1.png" alt="النشاط الأول" onerror="this.onerror=null; this.src='https://placehold.co/600x450/f3f4f6/9ca3af?text=+'" class="w-full h-full object-cover">
                </div>
                <div class="p-8 flex-grow flex flex-col justify-center text-center bg-white">
                    <h3 class="font-bold text-gray-800 group-hover:text-emerald-600 transition-colors text-4xl leading-snug">
                        النَّشاط الأَوَّل
                    </h3>
                </div>
            </a>

            <a href="k.html" 
               class="activity-card group bg-white rounded-3xl overflow-hidden border border-gray-200 shadow-md hover:shadow-lg transition-all duration-200 flex flex-col w-full hover:-translate-y-2">
                <div class="relative aspect-[16/9] w-full overflow-hidden bg-gray-50 border-b border-gray-100">
                    <img src="e4.png" alt="النشاط الرابع" onerror="this.onerror=null; this.src='https://placehold.co/600x450/f3f4f6/9ca3af?text=+'" class="w-full h-full object-cover">
                </div>
                <div class="p-8 flex-grow flex flex-col justify-center text-center bg-white">
                    <h3 class="font-bold text-gray-800 group-hover:text-emerald-600 transition-colors text-4xl leading-snug">
                        النَّشاط الثّاني
                    </h3>
                </div>
            </a>
        </div>
    </main>
</body>
</html>
